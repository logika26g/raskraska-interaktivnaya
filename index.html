<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2d1b4e">
<title>Интерактивная раскраска</title>
<style>
    :root { --bg-dark: #1a0f2e; --panel-bg: #2d1b4e; --accent: #7e57c2; --accent-hover: #9575cd; --text: #e8e0f5; --border: #4a2d6e; --container-bg: #2a1a4a; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-dark); color: var(--text); display: flex; flex-direction: column; overflow: hidden; }

    /* ---------- TOP BAR ---------- */
    #top-bar { background: var(--panel-bg); padding: 6px 12px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid var(--border); z-index: 100; flex-shrink: 0; position: relative; }
    #top-bar h1 { margin: 0; font-size: 16px; color: #d1c4e9; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
    
    .btn-menu { background: #5c6bc0; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn-menu:hover { background: #7986cb; }

    .top-controls { 
        display: none; 
        position: absolute; top: 100%; left: 0; right: 0; 
        background: var(--panel-bg); padding: 12px; 
        border-bottom: 2px solid var(--border);
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        z-index: 99;
        flex-wrap: wrap; gap: 8px; justify-content: center;
    }
    .top-controls.mobile-open { display: flex; }
    
    #scene-switcher { display: flex; align-items: center; gap: 4px; background: #241640; padding: 4px 8px; border-radius: 6px; }
    .scene-label { font-size: 12px; font-weight: 600; color: #b39ddb; }
    #scene-buttons button { width: 36px; height: 36px; border-radius: 6px; background: #352259; border: 1px solid transparent; color: #d1c4e9; font-weight: 700; cursor: pointer; }
    #scene-buttons button.active { background: #9b7be2; color: #fff; }

    button { background: var(--accent); color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: background 0.15s; min-height: 38px; touch-action: manipulation; }
    button:hover:not(:disabled) { background: var(--accent-hover); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button.btn-secondary { background: #5c6bc0; }
    button.btn-fullscreen { background: #ff5722; }
    button.btn-save { background: #00bcd4; }

    /* ---------- LAYOUT & CANVAS ---------- */
    #main-layout { display: flex; flex: 1; overflow: hidden; padding: 8px; gap: 8px; justify-content: center; min-height: 0; }
    #canvas-container { flex: 1; display: flex; justify-content: center; align-items: center; background: var(--container-bg); border-radius: 10px; border: 2px solid var(--border); position: relative; overflow: auto; box-shadow: inset 0 0 20px rgba(0,0,0,0.3); min-width: 0; touch-action: none; }
    #canvas-container::-webkit-scrollbar { width: 6px; height: 6px; }
    #canvas-container::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
    #board-wrapper { position: relative; box-shadow: 0 5px 20px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; margin: auto; }
    canvas { display: block; cursor: crosshair; touch-action: none; background-color: #ffffff; }

    /* ---------- TOOLS PANEL ---------- */
    #tools-panel { 
        width: 320px; background: var(--panel-bg); border-radius: 10px; border: 1px solid var(--border); 
        padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; flex-shrink: 0; max-height: 100%; 
        position: relative;
    }
    .section-title { font-size: 11px; font-weight: 700; color: #b39ddb; text-transform: uppercase; border-bottom: 1px solid var(--border); margin-top: 4px; padding-bottom: 2px; }
    
    /* ПАЛИТРА */
    .palette { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .color-swatch { width: 100%; aspect-ratio: 1; min-height: 30px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: transform 0.1s; }
    .color-swatch:hover { transform: scale(1.1); z-index: 2; }
    .color-swatch.active { border: 2px solid #fff; box-shadow: 0 0 0 2px var(--accent); }

    .tool-group { display: flex; gap: 6px; flex-wrap: wrap; }
    .tool-group button { flex: 1 1 30%; padding: 8px 4px; background: #3a2560; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; }
    .tool-group button span { font-size: 18px; }
    .tool-group button.active { background: var(--accent); border-color: var(--accent); }
    
    /* СКРЫТЫЕ НАСТРОЙКИ */
    .settings-panel { display: none; flex-direction: column; gap: 8px; background: #241640; padding: 10px; border-radius: 8px; margin-top: 4px; border: 1px solid var(--border); }
    .settings-panel.open { display: flex; }

    .slider-group { display: flex; align-items: center; gap: 8px; font-size: 13px; background: #352259; padding: 6px 10px; border-radius: 6px; }
    input[type=range] { flex: 1; accent-color: var(--accent); height: 24px; }
    .upload-block { background: #352259; border: 1px dashed #7e57c2; border-radius: 6px; padding: 10px; text-align: center; cursor: pointer; position: relative; font-size: 13px; font-weight: 600; min-height: 42px; display: flex; align-items: center; justify-content: center; }
    .upload-block input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    input[type="text"] { width: 100%; padding: 8px; border-radius: 6px; border: none; font-size: 13px; }

    /* ---------- FULLSCREEN & PANEL TOGGLE ---------- */
    #canvas-container:fullscreen, #canvas-container.pseudo-fullscreen { width: 100vw !important; height: 100vh !important; max-width: none !important; max-height: none !important; border-radius: 0 !important; border: none !important; background: #1a0f2e !important; }
    #canvas-container.pseudo-fullscreen { position: fixed; top: 0; left: 0; z-index: 9998; }
    #fs-exit-btn { display: none; position: absolute; top: 16px; right: 16px; z-index: 10000; width: 48px; height: 48px; border-radius: 50%; background: #e53935; color: #fff; font-size: 20px; border: 2px solid #fff; cursor: pointer; align-items: center; justify-content: center; }
    #canvas-container:fullscreen #fs-exit-btn, #canvas-container.pseudo-fullscreen #fs-exit-btn { display: flex; }

    #panel-toggle { display: none; position: absolute; top: 16px; right: 80px; z-index: 10000; width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 20px; border: 2px solid #fff; cursor: pointer; align-items: center; justify-content: center; }
    #canvas-container:fullscreen #panel-toggle, #canvas-container.pseudo-fullscreen #panel-toggle { display: flex; }
    #canvas-container.panel-collapsed #tools-panel { display: none !important; }

    #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #fff; padding: 10px 20px; border-radius: 30px; border: 2px solid var(--accent); font-size: 13px; z-index: 9999; opacity: 0; transition: opacity 0.3s; pointer-events: none; text-align: center; }

    /* ---------- АДАПТИВ ДЛЯ МОБИЛЬНЫХ ---------- */
    @media (max-width: 1024px) {
        #main-layout { flex-direction: column; padding: 4px; gap: 4px; }
        #tools-panel { width: 100%; max-height: 55vh; flex-direction: column; align-items: stretch; padding: 8px; gap: 8px; }
        .palette { grid-template-columns: repeat(7, 1fr); gap: 6px; width: 100%; }
        .color-swatch { min-height: 32px; }
        .section-title { display: block; margin-top: 0; font-size: 12px; }
        .tool-group { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; width: 100%; gap: 6px; }
        .tool-group button { flex: 1 0 80px; min-height: 60px; font-size: 12px; padding: 6px; }
        .tool-group button span { font-size: 20px; }
        .settings-panel { flex-direction: column; width: 100%; }
        .settings-panel .slider-group { width: 100%; }
        
        #canvas-container:fullscreen #tools-panel, #canvas-container.pseudo-fullscreen #tools-panel {
            position: fixed; right: 0; left: 0; bottom: 0; top: auto; transform: none; width: 100%; max-height: 50vh;
            border-radius: 12px 12px 0 0; border-left: none; border-right: none; border-bottom: none;
            z-index: 9999; box-shadow: 0 -4px 16px rgba(0,0,0,0.6);
        }
    }

    @media (max-height: 500px) and (orientation: landscape) {
        #tools-panel { max-height: 50vh; }
        #canvas-container:fullscreen #tools-panel, #canvas-container.pseudo-fullscreen #tools-panel {
            left: auto; right: 0; top: 50%; bottom: auto; transform: translateY(-50%);
            width: 240px; max-height: 95vh; border-radius: 12px 0 0 12px; border: 2px solid var(--accent);
            flex-direction: column; overflow-y: auto;
        }
        .palette { grid-template-columns: repeat(5, 1fr); }
    }

    #footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        background: rgba(26, 15, 46, 0.95);
        border-top: 1px solid var(--border);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 6px 12px;
        z-index: 1000;
        backdrop-filter: blur(5px);
    }

    #footer a {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
        color: #d1c4e9;
        font-size: 14px;
        font-weight: 600;
        transition: color 0.2s, transform 0.2s;
    }

    #footer a:hover {
        color: #ffffff;
        transform: scale(1.05);
    }

    .footer-logo {
        height: 28px;
        width: auto;
        border-radius: 4px;
    }

    @media (max-width: 1024px) {
        #footer { padding: 4px 8px; }
        #footer a { font-size: 12px; }
        .footer-logo { height: 22px; }
    }
</style>
</head>
<body>
<div id="top-bar">
    <div style="display:flex; align-items:center; gap:12px;">
        <h1>🎨 Раскраска</h1>
        <button id="btn-menu-toggle" onclick="toggleTopMenu()" class="btn-menu">⚙️ Управление</button>
    </div>
    
    <div class="top-controls" id="top-controls">
        <div id="scene-switcher"><span class="scene-label">Сцены:</span><div id="scene-buttons"></div></div>
        <button class="btn-secondary" onclick="toggleOrientation()" id="orientBtn">🔄 Книжная</button>
        <button class="btn-fullscreen" onclick="toggleFullscreen()" id="fsBtn">⛶ На весь экран</button>
    </div>
</div>

<div id="main-layout">
    <div id="canvas-container">
        <div id="board-wrapper"><canvas id="paintCanvas"></canvas></div>
        <button id="fs-exit-btn" onclick="toggleFullscreen()" title="Выйти">✖</button>
        <button id="panel-toggle" onclick="togglePanel()" title="Палитра">🎨</button>
    </div>
    
    <div id="tools-panel">
        <div class="section-title">Инструменты</div>
        <div class="tool-group">
            <button id="tool-brush" class="active" onclick="setTool('brush')"><span>✏️</span>Кисть</button>
            <button id="tool-fill" onclick="setTool('fill')"><span>🪣</span>Залив</button>
            <button onclick="cancelLastAction()"><span>✖️</span>Сброс</button>
            <button id="tool-picker" onclick="startPickerForFill()"><span>💧</span>Пипетка</button>
            <button id="tool-clean" onclick="cleanPaint()"><span>🧽</span>Смыть</button>
            <button onclick="toggleParams()" style="flex: 1 1 100%;"><span>🎚️</span>Параметры</button>
        </div>

        <!-- ПАНЕЛЬ ПАРАМЕТРОВ (ползунки) -->
        <div class="settings-panel" id="params-panel">
            <div class="slider-group"><span>Толщина:</span><input type="range" id="brushSize" min="1" max="50" value="5"><span id="sizeVal">5</span></div>
            <div class="slider-group"><span>Допуск:</span><input type="range" id="fillTolerance" min="0" max="80" value="32"><span id="tolVal">32</span></div>
            <div class="slider-group"><span>Масштаб:</span><input type="range" id="zoomControl" min="0.3" max="3" step="0.05" value="1"><button onclick="resetZoom()" style="padding:4px 6px; font-size:10px; min-height:auto;">1:1</button></div>
        </div>
        
        <div class="section-title">Палитра</div>
        <div class="palette" id="palette-container"></div>
        
        <div style="display:flex; align-items:center; gap:10px; margin-top:4px;">
            <input type="color" id="customColor" value="#000000" style="width:40px; height:30px; border:none; background:none; cursor:pointer; flex-shrink:0;">
            <span style="font-size:11px; color:#b39ddb;">Свой цвет</span>
        </div>

        <button class="btn-secondary" onclick="toggleSettings()" style="width: 100%; margin-top: auto; padding: 8px 12px; position: sticky; bottom: 0; z-index: 10; box-shadow: 0 -4px 10px rgba(0,0,0,0.3);">⚙️ Настройки и Загрузка</button>
        <!-- ПАНЕЛЬ ЗАГРУЗКИ (без ползунков) -->
        <div class="settings-panel" id="settings-panel">
            <label class="upload-block"><input type="file" id="imageLoader" accept="image/*" onchange="loadImageFromFile(event)">📁 Загрузить с ПК</label>
            <div style="display:flex; gap:4px; margin-top:4px;"><input type="text" id="imageUrl" placeholder="Прямая ссылка..."><button class="btn-secondary" onclick="loadImageFromUrl()">🌐</button></div>
            <div style="display:flex; gap:4px; margin-top:4px;"><input type="text" id="imageUrlProxy" placeholder="Ссылка (прокси)..."><button class="btn-secondary" onclick="loadImageFromProxy()" style="background:#ff9800;">🛡️</button></div>
        </div>
    </div>
</div>
<div id="toast">Сообщение</div>
<!-- ФУТЕР -->
<div id="footer">
    <a href="https://vk.ru/logika24" target="_blank" rel="noopener noreferrer">
        <span>Свинина Галина Сергеевна</span>
    </a>
</div>
<script>
    const canvas = document.getElementById('paintCanvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const wrapper = document.getElementById('board-wrapper');
    const container = document.getElementById('canvas-container');
    const zoomControl = document.getElementById('zoomControl');
    const orientBtn = document.getElementById('orientBtn');
    const fsBtn = document.getElementById('fsBtn');
    const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

    let isDrawing = false, currentTool = 'brush', currentColor = '#000000';
    let brushSize = isTouchDevice ? 8 : 5, fillTolerance = 32, lastX = 0, lastY = 0;
    let zoomLevel = 1, isLandscape = false, currentScene = 0;
    let pickerReturnTo = null, originalSnapshot = null;
    let pseudoFullscreen = false;
    let currentFitScale = 1;

    if (isTouchDevice) {
        document.getElementById('brushSize').value = brushSize;
        document.getElementById('sizeVal').textContent = brushSize;
    }

    const SCENE_COUNT = 5;
    const scenes = [];
    for (let i = 0; i < SCENE_COUNT; i++) {
        scenes.push({
            width: i % 2 === 0 ? 800 : 1000,
            height: i % 2 === 0 ? 1000 : 800,
            originalSnapshot: null,
            history: { stack: [], index: -1, max: 40, locked: false }
        });
    }

    function toggleTopMenu() {
        const controls = document.getElementById('top-controls');
        controls.classList.toggle('mobile-open');
        const btn = document.getElementById('btn-menu-toggle');
        if(controls.classList.contains('mobile-open')){ btn.innerHTML = '✖ Закрыть'; } 
        else { btn.innerHTML = '⚙️ Управление'; }
    }

    function toggleSettings() {
        const panel = document.getElementById('settings-panel');
        panel.classList.toggle('open');
    }

    function toggleParams() {
        const panel = document.getElementById('params-panel');
        panel.classList.toggle('open');
    }

    document.addEventListener('click', (e) => {
        const controls = document.getElementById('top-controls');
        const btn = document.getElementById('btn-menu-toggle');
        if (controls.classList.contains('mobile-open') && !controls.contains(e.target) && !btn.contains(e.target)) {
            controls.classList.remove('mobile-open');
            btn.innerHTML = '⚙️ Управление';
        }
    });

    function hist() { return scenes[currentScene].history; }
    function snapshot() {
        const h = hist(); if (h.locked) return;
        if (h.index < h.stack.length - 1) h.stack = h.stack.slice(0, h.index + 1);
        h.stack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        if (h.stack.length > h.max) h.stack.shift();
        h.index = h.stack.length - 1; updateUndoRedoButtons();
    }
    function restore(s) { const h = hist(); h.locked = true; ctx.putImageData(s, 0, 0); h.locked = false; }
    function undo() { const h = hist(); if (h.index <= 0) return showToast('Отменять нечего'); h.index--; restore(h.stack[h.index]); updateUndoRedoButtons(); showToast('Отменено'); }
    function redo() { const h = hist(); if (h.index >= h.stack.length - 1) return showToast('Повторять нечего'); h.index++; restore(h.stack[h.index]); updateUndoRedoButtons(); showToast('Повторено'); }
    function cancelLastAction() { undo(); }
    function updateUndoRedoButtons() {
        const h = hist(); const u = document.getElementById('undoBtn'); const r = document.getElementById('redoBtn');
        if (!u || !r) return; u.disabled = h.index <= 0; r.disabled = h.index >= h.stack.length - 1;
    }

    function buildSceneSwitcher() {
        const c = document.getElementById('scene-buttons');
        for (let i = 0; i < SCENE_COUNT; i++) {
            const b = document.createElement('button');
            b.textContent = i + 1; b.dataset.scene = i; b.onclick = () => switchScene(i);
            c.appendChild(b);
        }
        updateSceneSwitcherUI();
    }
    function updateSceneSwitcherUI() { document.querySelectorAll('#scene-buttons button').forEach(b => b.classList.toggle('active', parseInt(b.dataset.scene) === currentScene)); }
    function switchScene(index) {
        if (index === currentScene) return;
        if (hist().index >= 0) { const h = hist(); h.stack[h.index] = ctx.getImageData(0, 0, canvas.width, canvas.height); }
        const prev = scenes[currentScene]; prev.width = canvas.width; prev.height = canvas.height; prev.originalSnapshot = originalSnapshot;
        currentScene = index; originalSnapshot = scenes[currentScene].originalSnapshot;
        loadSceneToCanvas(); updateSceneSwitcherUI(); showToast('Сцена ' + (index + 1));
    }
    function loadSceneToCanvas() {
        const sc = scenes[currentScene]; canvas.width = sc.width; canvas.height = sc.height;
        const h = sc.history;
        if (h.index >= 0 && h.stack[h.index]) { ctx.putImageData(h.stack[h.index], 0, 0); }
        else { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height); h.locked = false; h.stack = [ctx.getImageData(0, 0, canvas.width, canvas.height)]; h.index = 0; }
        isLandscape = canvas.width > canvas.height; zoomLevel = 1; zoomControl.value = 1;
        updateTransform(); updateUndoRedoButtons();
    }

    let rafPending = false;
    function scheduleTransform() {
        if (rafPending) return;
        rafPending = true;
        requestAnimationFrame(() => { rafPending = false; updateTransform(); });
    }
    function updateTransform() {
        const cw = container.clientWidth, ch = container.clientHeight;
        const availW = Math.max(10, cw - 20), availH = Math.max(10, ch - 20);
        const visualW = isLandscape ? canvas.height : canvas.width;
        const visualH = isLandscape ? canvas.width : canvas.height;

        currentFitScale = Math.min(availW / visualW, availH / visualH);
        const totalScale = currentFitScale * zoomLevel;
        const rawW = canvas.width * totalScale, rawH = canvas.height * totalScale;

        wrapper.style.margin = 'auto';
        wrapper.style.transform = 'none';

        if (isLandscape) {
            wrapper.style.width = rawH + 'px'; wrapper.style.height = rawW + 'px';
            canvas.style.position = 'absolute'; canvas.style.left = '50%'; canvas.style.top = '50%';
            canvas.style.width = rawW + 'px'; canvas.style.height = rawH + 'px';
            canvas.style.transform = 'translate(-50%, -50%) rotate(90deg)';
        } else {
            wrapper.style.width = rawW + 'px'; wrapper.style.height = rawH + 'px';
            canvas.style.position = 'static'; canvas.style.left = ''; canvas.style.top = '';
            canvas.style.width = rawW + 'px'; canvas.style.height = rawH + 'px';
            canvas.style.transform = 'none';
        }
        orientBtn.textContent = isLandscape ? '🔄 Альбомная' : '🔄 Книжная';

        requestAnimationFrame(() => {
            if (container.scrollWidth > container.clientWidth) container.scrollLeft = (container.scrollWidth - container.clientWidth) / 2;
            else container.scrollLeft = 0;
            if (container.scrollHeight > container.clientHeight) container.scrollTop = (container.scrollHeight - container.clientHeight) / 2;
            else container.scrollTop = 0;
        });
    }

    window.addEventListener('resize', scheduleTransform);
    window.addEventListener('orientationchange', () => setTimeout(scheduleTransform, 150));

    let panelPlaceholder = null;
    function enterPanelIntoContainer() {
        const panel = document.getElementById('tools-panel');
        if (panel.parentElement === container) return;
        panelPlaceholder = document.createElement('div'); panelPlaceholder.style.display = 'none';
        panel.parentNode.insertBefore(panelPlaceholder, panel); container.appendChild(panel);
    }
    function returnPanelFromContainer() {
        const panel = document.getElementById('tools-panel');
        if (panel.parentElement !== container) return;
        if (panelPlaceholder && panelPlaceholder.parentNode) {
            panelPlaceholder.parentNode.insertBefore(panel, panelPlaceholder);
            panelPlaceholder.remove(); panelPlaceholder = null;
        }
        container.classList.remove('panel-collapsed');
        const btn = document.getElementById('panel-toggle'); if (btn) btn.textContent = '🎨';
    }
    function togglePanel() {
        container.classList.toggle('panel-collapsed');
        const btn = document.getElementById('panel-toggle');
        if (btn) btn.textContent = container.classList.contains('panel-collapsed') ? '🎨' : '✖';
    }
    function enterPseudoFullscreen() {
        container.classList.add('pseudo-fullscreen'); pseudoFullscreen = true;
        fsBtn.textContent = '⛶ Выйти'; enterPanelIntoContainer(); window.scrollTo(0, 1); setTimeout(updateTransform, 100);
    }
    function exitPseudoFullscreen() {
        container.classList.remove('pseudo-fullscreen'); pseudoFullscreen = false;
        fsBtn.textContent = '⛶ На весь экран'; returnPanelFromContainer(); setTimeout(updateTransform, 100);
    }
    function toggleFullscreen() {
        if (pseudoFullscreen) { exitPseudoFullscreen(); return; }
        if (!document.fullscreenElement) {
            if (container.requestFullscreen) {
                container.requestFullscreen().then(() => { fsBtn.textContent = '⛶ Выйти'; enterPanelIntoContainer(); setTimeout(updateTransform, 100); }).catch(() => enterPseudoFullscreen());
            } else { enterPseudoFullscreen(); }
        } else {
            document.exitFullscreen().then(() => { fsBtn.textContent = '⛶ На весь экран'; returnPanelFromContainer(); setTimeout(updateTransform, 100); }).catch(() => exitPseudoFullscreen());
        }
    }
    document.addEventListener('fullscreenchange', () => { const isFs = !!document.fullscreenElement; fsBtn.textContent = (isFs || pseudoFullscreen) ? '⛶ Выйти' : '⛶ На весь экран'; setTimeout(updateTransform, 50); });
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && pseudoFullscreen) exitPseudoFullscreen(); });

    function toggleOrientation() { isLandscape = !isLandscape; zoomLevel = 1; zoomControl.value = 1; updateTransform(); }
    zoomControl.addEventListener('input', e => { zoomLevel = parseFloat(e.target.value); updateTransform(); });
    function resetZoom() { zoomLevel = 1; zoomControl.value = 1; updateTransform(); }    
    // === ПАЛИТРА (добавлены светлые оттенки) ===
    const colors = [
        // базовые тёмные/насыщенные
        '#000000', '#4a0000', '#800000', '#b30000', '#ff0000', '#ff4d4d', '#ff9999',
        '#8b4513', '#a0522d', '#d2691e', '#ff8c00', '#ffa500', '#ffd700', '#ffff99',
        '#808000', '#00ff00', '#008000', '#006400', '#00ffff', '#00bfff', '#0000ff',
        '#4b0082', '#800080', '#ff00ff', '#ff69b4', '#ffffff', '#d3d3d3', '#808080',
        // светлые / пастельные оттенки
        '#fff5f5', '#ffe0e0', '#ffc1c1', '#ffd6a5', '#fff2b2', '#e6ffcc', '#d4f8d4',
        '#d0f0fd', '#cfe8ff', '#dcd6ff', '#f0e0ff', '#ffd9ec', '#f5f5f5', '#e8e8e8'
    ];
    const paletteContainer = document.getElementById('palette-container');
    colors.forEach(color => {
        const div = document.createElement('div'); 
        div.className = 'color-swatch'; div.style.backgroundColor = color; div.dataset.color = color.toLowerCase();
        if (color === '#000000') div.classList.add('active');
        div.onclick = () => { selectColor(color); if (currentTool !== 'fill' && currentTool !== 'brush') setTool('brush'); };
        paletteContainer.appendChild(div);
    });
    function selectColor(color) {
        currentColor = color.toLowerCase();
        document.querySelectorAll('.color-swatch').forEach(el => el.classList.toggle('active', el.dataset.color === currentColor));
        document.getElementById('customColor').value = currentColor;
        if (pickerReturnTo) { const target = pickerReturnTo; pickerReturnTo = null; setTool(target); showToast('Цвет: ' + color); }
    }
    document.getElementById('customColor').addEventListener('input', e => selectColor(e.target.value));
    function startPickerForFill() {
        const activeBtn = document.querySelector('.tool-group button.active');
        if (activeBtn && activeBtn.id === 'tool-fill') pickerReturnTo = 'fill';
        else if (activeBtn && activeBtn.id === 'tool-brush') pickerReturnTo = 'brush';
        setTool('picker');
    }
    function setTool(tool) {
        currentTool = tool;
        document.querySelectorAll('.tool-group button').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById('tool-' + tool); if (btn) btn.classList.add('active');
        canvas.style.cursor = tool === 'fill' ? 'copy' : 'crosshair';
    }
    function cleanPaint() {
        if (originalSnapshot && originalSnapshot.width === canvas.width) {
            if (!confirm('Смыть краску, оставив контур?')) return;
            ctx.putImageData(originalSnapshot, 0, 0);
        } else {
            if (!confirm('Смыть краску?')) return;
            const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
            for (let i = 0; i <img.data.length; i += 4) {
                if (img.data[i+3] === 0) continue;
                if (0.299*img.data[i] + 0.587*img.data[i+1] + 0.114*img.data[i+2] > 50) { img.data[i] = img.data[i+1] = img.data[i+2] = img.data[i+3] = 255; }
            }
            ctx.putImageData(img, 0, 0);
        }
        snapshot(); showToast('Смыто');
    }
     document.getElementById('brushSize').addEventListener('input', e => { 
        brushSize = parseInt(e.target.value); 
        document.getElementById('sizeVal').textContent = brushSize; 
    });
    
    document.getElementById('fillTolerance').addEventListener('input', e => { 
        fillTolerance = parseInt(e.target.value); 
        document.getElementById('tolVal').textContent = fillTolerance; 
    });

    function getExactCoordinates(evt) {
        const rect = canvas.getBoundingClientRect();
        const clientX = evt.clientX !== undefined ? evt.clientX : (evt.touches?.[0]?.clientX || 0);
        const clientY = evt.clientY !== undefined ? evt.clientY : (evt.touches?.[0]?.clientY || 0);
        if (isLandscape) { return { x: (rect.height - (clientY - rect.top)) * (canvas.width / rect.height), y: (clientX - rect.left) * (canvas.height / rect.width) }; }
        return { x: (clientX - rect.left) * (canvas.width / rect.width), y: (clientY - rect.top) * (canvas.height / rect.height) };
    }
    
    function handlePointerDown(clientX, clientY) {
        const pos = getExactCoordinates({ clientX, clientY });
        if (currentTool === 'picker') {
            if (pos.x < 0 || pos.x >= canvas.width || pos.y < 0 || pos.y >= canvas.height) return;
            const p = ctx.getImageData(Math.floor(pos.x), Math.floor(pos.y), 1, 1).data;
            let hex = p[3] === 0 ? '#ffffff' : '#' + ((1 << 24) + (p[0] << 16) + (p[1] << 8) + p[2]).toString(16).slice(1);
            selectColor(hex); showToast('Цвет выбран: ' + hex); return;
        }
        if (currentTool === 'fill') { floodFill(pos.x, pos.y, currentColor); return; }
        isDrawing = true; lastX = pos.x; lastY = pos.y;
        drawSegment(pos.x, pos.y);
    }
    
    function handlePointerMove(clientX, clientY) {
        if (!isDrawing) return;
        const pos = getExactCoordinates({ clientX, clientY });
        drawSegment(pos.x, pos.y);
    }
    
    function handlePointerUp() { if (isDrawing) { isDrawing = false; snapshot(); } }
    
    function drawSegment(x, y) {
        ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(x, y);
        ctx.globalCompositeOperation = 'source-over'; 
        ctx.strokeStyle = currentColor;
        const scale = currentFitScale * zoomLevel; 
        const internalScale = scale > 0 ? 1 / scale : 1;
        ctx.lineWidth = brushSize * internalScale; 
        ctx.lineCap = 'round'; 
        ctx.lineJoin = 'round';
        ctx.stroke(); 
        ctx.globalCompositeOperation = 'source-over';
        lastX = x; lastY = y;
    }

    // === МЫШЬ И ТАЧ ===
    canvas.addEventListener('mousedown', e => {
        if (e.sourceCapabilities && e.sourceCapabilities.firesTouchEvents) return;
        e.preventDefault(); handlePointerDown(e.clientX, e.clientY);
    });
    
    canvas.addEventListener('mousemove', e => { 
        if (isDrawing) { e.preventDefault(); handlePointerMove(e.clientX, e.clientY); } 
    });
    
    window.addEventListener('mouseup', handlePointerUp);
    canvas.addEventListener('mouseleave', handlePointerUp);

    // Панорамирование двумя пальцами
    let panStart = null;
    canvas.addEventListener('touchstart', e => {
        if (e.touches.length === 2) {
            panStart = { x: e.touches[0].clientX, y: e.touches[0].clientY, sl: container.scrollLeft, st: container.scrollTop };
            handlePointerUp(); e.preventDefault(); return;
        }
        if (e.touches.length !== 1) { handlePointerUp(); return; }
        e.preventDefault(); handlePointerDown(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    canvas.addEventListener('touchmove', e => {
        if (e.touches.length === 2 && panStart) {
            const dx = e.touches[0].clientX - panStart.x, dy = e.touches[0].clientY - panStart.y;
            container.scrollLeft = panStart.sl - dx; container.scrollTop = panStart.st - dy;
            e.preventDefault(); return;
        }
        if (e.touches.length !== 1) return;
        e.preventDefault(); handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: false });

    canvas.addEventListener('touchend', e => { 
        if (e.touches.length < 2) panStart = null; 
        e.preventDefault(); handlePointerUp(); 
    }, { passive: false });
    
    canvas.addEventListener('touchcancel', e => { 
        panStart = null; e.preventDefault(); handlePointerUp(); 
    }, { passive: false });

    // Панорамирование средней кнопкой мыши
    let middlePan = null;
    canvas.addEventListener('mousedown', e => { 
        if (e.button === 1) { middlePan = { x: e.clientX, y: e.clientY, sl: container.scrollLeft, st: container.scrollTop }; e.preventDefault(); } 
    });
    window.addEventListener('mousemove', e => { 
        if (middlePan) { container.scrollLeft = middlePan.sl - (e.clientX - middlePan.x); container.scrollTop = middlePan.st - (e.clientY - middlePan.y); e.preventDefault(); } 
    });
    window.addEventListener('mouseup', e => { if (e.button === 1) middlePan = null; });

    // === ЗАЛИВКА ===
    function hexToRgb(hex) { 
        const m = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex); 
        return m ? { r: parseInt(m[1], 16), g: parseInt(m[2], 16), b: parseInt(m[3], 16) } : { r: 0, g: 0, b: 0 }; 
    }

    function floodFill(startX, startY, fillColor) {
        const x0 = Math.floor(startX), y0 = Math.floor(startY), W = canvas.width, H = canvas.height;
        if (x0 < 0 || x0 >= W || y0 < 0 || y0 >= H) return;
        
        const imageData = ctx.getImageData(0, 0, W, H), data = imageData.data, fill = hexToRgb(fillColor), startPos = (y0 * W + x0) * 4;
        const sR = data[startPos], sG = data[startPos + 1], sB = data[startPos + 2], sA = data[startPos + 3];
        if (sR === fill.r && sG === fill.g && sB === fill.b && sA === 255) return;
        
        const tolRGB = fillTolerance, tolA = Math.max(8, Math.floor(fillTolerance / 2));
        const match = pos => { 
            const a = data[pos + 3]; 
            if ((a === 0) !== (sA === 0)) return false; 
            return Math.abs(data[pos] - sR) <= tolRGB && Math.abs(data[pos + 1] - sG) <= tolRGB && Math.abs(data[pos + 2] - sB) <= tolRGB && Math.abs(a - sA) <= tolA; 
        };
        
        const visited = new Uint8Array(W * H), stack = [y0 * W + x0];
        while (stack.length > 0) {
            const idx = stack.pop(); 
            if (visited[idx] || !match(idx * 4)) continue;
            let y = (idx / W) | 0, x = idx - y * W, cur = idx;
            while (y > 0 && !visited[cur - W] && match((cur - W) * 4)) { y--; cur -= W; }
            let reachLeft = false, reachRight = false;
            while (y < H && !visited[cur] && match(cur * 4)) {
                data[cur * 4] = fill.r; data[cur * 4 + 1] = fill.g; data[cur * 4 + 2] = fill.b; data[cur * 4 + 3] = 255; visited[cur] = 1;
                if (x > 0) { 
                    const left = cur - 1; 
                    if (!visited[left] && match(left * 4)) { if (!reachLeft) { stack.push(left); reachLeft = true; } } 
                    else reachLeft = false; 
                }
                if (x < W - 1) { 
                    const right = cur + 1; 
                    if (!visited[right] && match(right * 4)) { if (!reachRight) { stack.push(right); reachRight = true; } } 
                    else reachRight = false; 
                }
                y++; cur += W;
            }
        }
        ctx.putImageData(imageData, 0, 0); 
        snapshot();
    }

    // === ЗАГРУЗКА ИЗОБРАЖЕНИЙ ===
    function loadImageFromFile(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = e => { 
            const img = new Image(); 
            img.onload = () => { drawImageToCanvas(img); showToast('Картинка загружена'); }; 
            img.onerror = () => showToast('Ошибка'); 
            img.src = e.target.result; 
        };
        reader.readAsDataURL(file); event.target.value = '';
    }

    function loadImageFromUrl() {
        const url = document.getElementById('imageUrl').value.trim(); 
        if (!url) return showToast('Введите ссылку');
        const img = new Image(); img.crossOrigin = 'Anonymous';
        img.onload = () => { drawImageToCanvas(img); showToast('Загружено по ссылке'); };
        img.onerror = () => showToast('Ошибка загрузки. Попробуйте прокси.');
        img.src = url;
    }

    function loadImageFromProxy() {
        const url = document.getElementById('imageUrlProxy').value.trim(); 
        if (!url) return showToast('Введите ссылку');
        const cleanUrl = url.replace(/^https?:\/\//i, ''), proxyUrl = `https://wsrv.nl/?url=${cleanUrl}`;
        showToast('Загрузка через прокси...');
        const img = new Image(); img.crossOrigin = 'Anonymous';
        img.onload = () => { drawImageToCanvas(img); showToast('Успешно загружено!'); };
        img.onerror = () => showToast('Прокси не смог загрузить.');
        img.src = proxyUrl;
    }

    function drawImageToCanvas(img) {
        const max = 1500; let w = img.width, h = img.height;
        if (w > max) { h = h * (max / w); w = max; } 
        if (h > max) { w = w * (max / h); h = max; }
        canvas.width = Math.round(w); canvas.height = Math.round(h);
        ctx.clearRect(0, 0, canvas.width, canvas.height); 
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        originalSnapshot = ctx.getImageData(0, 0, canvas.width, canvas.height);
        isLandscape = canvas.width > canvas.height; 
        zoomLevel = 1; zoomControl.value = 1; updateTransform();
        
        const sc = scenes[currentScene]; 
        sc.width = canvas.width; sc.height = canvas.height; sc.originalSnapshot = originalSnapshot;
        sc.history.stack = []; sc.history.index = -1; sc.history.locked = false;
        snapshot(); updateUndoRedoButtons();
    }

    // === СОХРАНЕНИЕ ===
    function saveImage() {
        const t = document.createElement('canvas'); t.width = canvas.width; t.height = canvas.height;
        const tc = t.getContext('2d'); tc.fillStyle = '#ffffff'; tc.fillRect(0, 0, t.width, t.height); tc.drawImage(canvas, 0, 0);
        const l = document.createElement('a'); l.download = 'raskraska-scene-' + (currentScene + 1) + '.png'; l.href = t.toDataURL('image/png'); l.click();
        showToast('Сцена сохранена в PNG');
    }

    function clearCanvasConfirm() {
        if (!confirm('Очистить холст?')) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height); 
        ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        originalSnapshot = null; scenes[currentScene].originalSnapshot = null;
        snapshot(); showToast('Сцена очищена');
    }

    let toastTimeout;
    function showToast(msg) {
        const t = document.getElementById('toast'); 
        t.textContent = msg; t.style.opacity = '1';
        if (toastTimeout) clearTimeout(toastTimeout); 
        toastTimeout = setTimeout(() => t.style.opacity = '0', 3000);
    }

    function saveProjectToFile() {
        try {
            const data = scenes.map((sc, i) => {
                let img = null;
                if (i === currentScene) img = canvas.toDataURL('image/png');
                else if (sc.history.index >= 0) { 
                    const t = document.createElement('canvas'); t.width = sc.width; t.height = sc.height; 
                    t.getContext('2d').putImageData(sc.history.stack[sc.history.index], 0, 0); 
                    img = t.toDataURL('image/png'); 
                }
                return { width: sc.width, height: sc.height, image: img };
            });
            const str = JSON.stringify(data), blob = new Blob([str], {type: "application/json"}), url = URL.createObjectURL(blob);
            const link = document.createElement('a'); link.href = url; link.download = 'raskraska-proekt.json';
            document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url);
            showToast('Проект сохранён!');
        } catch (e) { showToast('Ошибка сохранения'); }
    }

    function loadProjectFromFile(event) {
        const file = event.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            try {
                const projectData = JSON.parse(e.target.result);
                if (!Array.isArray(projectData) || projectData.length === 0) throw new Error('Неверный формат');
                const loadedScenes = projectData.map(sc => ({
                    width: sc.width, height: sc.height, originalSnapshot: null,
                    history: { stack: [{img: sc.image}], index: 0, max: 40, locked: false }
                }));
                let loadedCount = 0; const total = loadedScenes.length;
                loadedScenes.forEach((sc) => {
                    if (!sc.history.stack[0].img) {
                        const t = document.createElement('canvas'); t.width = sc.width; t.height = sc.height; 
                        const tc = t.getContext('2d'); tc.fillStyle = '#ffffff'; tc.fillRect(0, 0, sc.width, sc.height);
                        sc.history.stack = [tc.getImageData(0, 0, sc.width, sc.height)];
                        loadedCount++; if (loadedCount === total) finishLoad(); return;
                    }
                    const img = new Image();
                    img.onload = () => {
                        const t = document.createElement('canvas'); t.width = sc.width; t.height = sc.height; 
                        const tc = t.getContext('2d'); tc.fillStyle = '#ffffff'; tc.fillRect(0, 0, sc.width, sc.height); tc.drawImage(img, 0, 0);
                        sc.history.stack = [tc.getImageData(0, 0, sc.width, sc.height)];
                        loadedCount++; if (loadedCount === total) finishLoad();
                    };
                    img.onerror = () => { loadedCount++; if (loadedCount === total) finishLoad(); };
                    img.src = sc.history.stack[0].img;
                });
                function finishLoad() {
                    scenes.length = 0; loadedScenes.forEach(sc => scenes.push(sc));
                    currentScene = 0; originalSnapshot = scenes[0].originalSnapshot || null;
                    loadSceneToCanvas(); updateSceneSwitcherUI(); showToast('Проект загружен!');
                }
            } catch (err) { alert('Не удалось загрузить проект.'); }
        };
        reader.readAsText(file); event.target.value = '';
    }

    // === СТАРТ ===
    buildSceneSwitcher();
    loadSceneToCanvas();
    window.addEventListener('load', () => { updateTransform(); updateSceneSwitcherUI(); });
    setTimeout(updateTransform, 300);
    setTimeout(updateTransform, 1000);
</script>
